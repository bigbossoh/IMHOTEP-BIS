<div class="npc-dialog">

  <!-- En-tête -->
  <div class="npc-dialog__header">
    <div class="npc-dialog__icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"/>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
      </svg>
    </div>
    <div>
      <h2 class="npc-dialog__title">Nouveau tarif</h2>
      <p class="npc-dialog__subtitle">
        Grille tarifaire pour <strong>{{ varData?.cate?.name }}</strong>
      </p>
    </div>
    <button type="button" class="npc-dialog__close" (click)="dialogRef.close()">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Corps du formulaire -->
  <div class="npc-dialog__body">
    <div class="npc-form-group">
      <label class="npc-form-label" for="nombreDeJourInput">Libellé de la tranche <span class="npc-required">*</span></label>
      <input
        id="nombreDeJourInput"
        type="text"
        class="npc-form-control"
        [(ngModel)]="nombreDeJour"
        placeholder="Ex : 0 à 2 nuits"
        autocomplete="off"
      />
    </div>

    <div class="npc-form-row">
      <div class="npc-form-group">
        <label class="npc-form-label" for="nbrDiffJourInput">Jusqu'à (jours) <span class="npc-required">*</span></label>
        <input
          id="nbrDiffJourInput"
          type="number"
          min="0"
          class="npc-form-control"
          [(ngModel)]="nbrDiffJour"
          placeholder="Ex : 2"
        />
      </div>
      <div class="npc-form-group">
        <label class="npc-form-label" for="prixInput">Prix (FCFA) <span class="npc-required">*</span></label>
        <input
          id="prixInput"
          type="number"
          min="0"
          class="npc-form-control"
          [(ngModel)]="prix"
          placeholder="Ex : 25000"
        />
      </div>
    </div>

    <div class="npc-form-group">
      <label class="npc-form-label" for="intervalPrixInput">Intervalle</label>
      <input
        id="intervalPrixInput"
        type="number"
        min="0"
        class="npc-form-control"
        [(ngModel)]="intervalPrix"
        placeholder="Optionnel"
      />
    </div>

    <div class="npc-form-group">
      <label class="npc-form-label" for="descInput">Description</label>
      <textarea
        id="descInput"
        class="npc-form-control npc-form-control--textarea"
        [(ngModel)]="descpition"
        placeholder="Description optionnelle du tarif..."
        rows="2"
      ></textarea>
    </div>
  </div>

  <!-- Pied -->
  <div class="npc-dialog__footer">
    <button type="button" class="npc-btn npc-btn--ghost" (click)="dialogRef.close()">
      Annuler
    </button>
    <button
      type="button"
      class="npc-btn npc-btn--primary"
      (click)="onSaveForm()"
      [disabled]="!isFormValid"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      Enregistrer
    </button>
  </div>

</div>
